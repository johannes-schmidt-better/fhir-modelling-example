name: Build and deploy IG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: hl7fhir/ig-publisher-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IG Publisher
        run: bash ./_updatePublisher.sh -f -y

      - name: Build IG
        run: bash ./_genonce.sh

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
